[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox"
version = "0.1.0"
description = "A flight recorder for AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "rich",
    "google-genai",
    "openai",
    "sentence-transformers",
    "numpy",
    "pandas",
    "datasets",
    "lightgbm",
    "shap",
    "scikit-learn",
    "rapidfuzz",
    "tenacity",
    "httpx",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
bb = "blackbox.cli:app"

[tool.setuptools.packages.find]
include = ["blackbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
